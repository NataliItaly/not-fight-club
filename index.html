<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Fight Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="shortcut icon" href="favicon1.png" type="image/x-icon" />
  </head>
  <body>
    <video class="video" id="video-bg" autoplay muted loop playsinline>
      <source src="./assets/space-video.mp4" type="video/mp4" />
    </video>
    <header class="header" id="header">
      <nav class="header__nav">
        <a class="header__logo" href="#">
          <span class="header__logo-animation">
            <em>C</em>
            <em class="planet left">O</em>
            <em>S</em>
            <em>M</em>
            <em class="planet right">O</em>
            <em class="transparent">S</em>
          </span>
          <span>Wars</span>
        </a>
        <ul class="header__menu">
          <li class="header__menu-item">
            <button class="header__link" id="home-link">
              <img class="header__img" src="./assets/home.svg" alt="Home" />
            </button>
          </li>
          <li class="header__menu-item">
            <button class="header__link" id="settings-link">
              <img
                class="header__img"
                src="./assets/settings.svg"
                alt="Settings"
              />
            </button>
          </li>
          <li class="header__menu-item">
            <button class="header__link" id="profile-link">
              <img
                class="header__img"
                src="./assets/profile.svg"
                alt="Profile"
              />
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <main class="main" id="main">
      <button class="btn main__btn" id="create-character">
        Create Character
      </button>

      <div class="fight" id="fight-screen">
        <div class="fight__zones" id="fight-zones">
          <div class="fight__zone">
            <h2 class="fight__title">Pick 1 Attack zone and 2 Defence zones</h2>
            <div class="fight__settings">
              <div class="fight__defence" id="defence">
                <h3 class="fight__type-title">Defence</h3>
              </div>
              <div class="human">
                <div class="human__body human__head"></div>
                <div class="human__body human__neck"></div>
                <div class="human__body human__breast"></div>
                <div class="human__body human__belly"></div>
                <div class="human__body human__legs"></div>
              </div>
              <div class="fight__attack" id="attack">
                <h3 class="fight__type-title">Attack</h3>
              </div>
              <div class="fight__btn-wrapper">
                <button class="btn fight__btn" id="fight" disabled>
                  Fight
                </button>
                <button
                  class="btn fight__critical-btn"
                  id="critical-btn"
                  disabled
                >
                  Super Hit
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="fight__output" id="fight-output"></div>
      </div>

      <div class="profile" id="profile"></div>
    </main>
    <div class="popup" id="popup">
      <button class="popup__close" id="close-popup">
        <img src="./assets/close.svg" alt="Close popup" />
      </button>
      <div class="popup__tab choose-character">
        <div>
          <h2 class="popup__title choose-character__title">
            Choose Your Character
          </h2>
          <button class="btn_next btn_secondary" id="get-random-character">
            Or Get Random Character
          </button>
        </div>
        <ul class="list choose-character__list" id="choose-character-list"></ul>
        <button
          class="btn_secondary btn_next"
          id="choose-character-btn"
          disabled
        >
          Next
        </button>
      </div>
      <div class="popup__tab create" id="create-popup">
        <div class="create__content">
          <div class="create__form">
            <label for="character" class="popup__title">
              Give Name To Your character
            </label>
            <input
              class="create__input"
              type="text"
              name="character-input"
              id="character-input"
              required
            />
            <button
              class="btn_next btn_secondary"
              id="choose-name-btn"
              disabled
              title="Write name of your character"
            >
              Next
            </button>
          </div>
        </div>
      </div>
      <div class="popup__tab locations" id="locations-popup">
        <div class="locations__content">
          <h2 class="popup__title locations__title">
            Where do you want to fight?
          </h2>
          <button class="btn_secondary btn_next" id="get-random-location">
            Get Random Location
          </button>
          <ul class="list locations__list" id="locations-list"></ul>
          <button class="btn_secondary btn_next" id="submit-game" disabled>
            Next
          </button>
        </div>
      </div>
      <div class="popup__tab">
        <div class="character-view" id="character-view"></div>
        <button class="btn character-view__btn" id="start-game-btn">
          Start Game
        </button>
      </div>
    </div>
    <div class="winner" id="winner-popup">
      <div class="winner__content" id="winner-content">
        <h2 class="winner__title" id="winner-title"></h2>
        <button class="winner__close" id="winner-close-btn">
          <img src="./assets/close.svg" alt="Close popup" id="winner-close" />
        </button>
        <button class="btn" id="back-to-main">Back to Main</button>
      </div>
    </div>
    <script type="module" src="./script/script.js"></script>
  </body>
</html>
