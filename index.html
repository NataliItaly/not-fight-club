<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Fight Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
  </head>
  <body>
    <video class="video" id="video-bg" autoplay muted loop playsinline>
      <source src="./assets/space-video.mp4" type="video/mp4" />
    </video>
    <header class="header">
      <nav class="header__nav">
        <a class="header__logo" href="#">
          <span class="header__logo-animation">
            <em>C</em>
            <em class="planet left">O</em>
            <em>S</em>
            <em>M</em>
            <em class="planet right">O</em>
            <em class="transparent">S</em>
          </span>
          <span>Wars</span>
        </a>
        <ul class="header__menu">
          <li class="header__menu-item">
            <a class="header__link" href="#">
              <img class="header__img" src="./assets/home.svg" alt="Home" />
            </a>
          </li>
          <li class="header__menu-item">
            <a class="header__link" href="#">
              <img
                class="header__img"
                src="./assets/settings.svg"
                alt="Settings"
              />
            </a>
          </li>
          <li class="header__menu-item">
            <a class="header__link" href="#">
              <img
                class="header__img"
                src="./assets/profile.svg"
                alt="Profile"
              />
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="main">
      <button class="main__btn" id="start-btn">Start Game</button>
    </main>
    <div class="popup" id="popup">
      <button class="popup__close" id="close-popup">
        <img src="./assets/close.svg" alt="Close popup" />
      </button>
      <div class="popup__tab choose-character">
        <div>
          <h2 class="popup__title choose-character__title">
            Choose Your Character
          </h2>
          <button class="btn btn_next btn_secondary" id="get-random-character">
            Or Get Random Character
          </button>
        </div>
        <ul class="list choose-character__list" id="choose-character-list"></ul>
        <button
          class="btn btn_secondary btn_next"
          id="choose-character-btn"
          disabled
        >
          Next
        </button>
      </div>
      <div class="popup__tab create" id="create-popup">
        <div class="create__content">
          <div class="create__form">
            <label for="character" class="popup__title">
              Give Name To Your character
            </label>
            <input
              class="create__input"
              type="text"
              name="character-input"
              id="character-input"
              required
            />
            <button
              class="btn btn_next btn_secondary"
              id="choose-name-btn"
              disabled
              title="Write name of your character"
            >
              Next
            </button>
          </div>
        </div>
      </div>
      <div class="popup__tab locations" id="locations-popup">
        <div class="locations__content">
          <h2 class="popup__title locations__title">
            Where do you want to fight?
          </h2>
          <button class="btn_secondary btn_next" id="get-random-location">
            Get Random Location
          </button>
          <ul class="list locations__list" id="locations-list"></ul>
          <button class="btn btn_secondary btn_next" id="submit-game" disabled>
            Next
          </button>
        </div>
      </div>
      <div class="popup__tab">
        <h2 class="popup__title">Your character is</h2>
        <div class="character-view" id="character-view"></div>
      </div>
      <div class="popup__tab fight-screen">
        <h2 class="popup__title">
          Please pick 1 Attack zone and 2 Defence zones
        </h2>
        <div class="fight">
          <div class="hero">
            <h3 class="hero__name" id="hero"></h3>
            <div class="hero__image"></div>
            <div class="hero__health"></div>
            <div id="wrap">
              <div class="container" id="progess">
                <div class="sphere" id="sphere1"></div>
                <div class="sphere" id="sphere2"></div>
                <div class="sphere" id="sphere3"></div>
                <div class="sphere" id="sphere4"></div>
                <div class="sphere" id="sphere5"></div>
                <div class="sphere" id="sphere6"></div>
                <div class="sphere" id="sphere7"></div>
                <div class="sphere" id="sphere8"></div>
                <div class="sphere" id="sphere9"></div>
                <div class="sphere" id="sphere10"></div>

                <div class="clear"></div>
              </div>
              <div class="shadow" id="shadow1"></div>
              <div class="shadow" id="shadow2"></div>
              <div class="shadow" id="shadow3"></div>
              <div class="shadow" id="shadow4"></div>
              <div class="shadow" id="shadow5"></div>
              <div class="shadow" id="shadow6"></div>
              <div class="shadow" id="shadow7"></div>
              <div class="shadow" id="shadow8"></div>
              <div class="shadow" id="shadow9"></div>
              <div class="shadow" id="shadow10"></div>
            </div>
            <div class="hero__health-value">100%</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./script/script.js"></script>
  </body>
</html>
